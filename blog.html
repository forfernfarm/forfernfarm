<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บทความทั้งหมด — ฟ.เฟิน.ฟาร์ม</title>
<meta name="description" content="รวมบทความความรู้เรื่องเฟิร์นสไบนาง เทคนิคการดูแล และกิจกรรมจากฟาร์มลพบุรี">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --forest:#1a3a2a; --forest-mid:#2d5a3d; --forest-light:#4a7c59;
  --sage:#7aab8a; --mint:#b8d4c0; --cream:#f7f3ed; --ivory:#fdfaf5;
  --gold:#c9a96e; --gold-light:#e8d5a3;
  --text-dark:#1a2018; --text-mid:#3d4a35; --text-light:#6b7a60; --white:#ffffff;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family:'Sarabun',sans-serif; background:var(--ivory); color:var(--text-dark); }

/* NAV */
nav {
  position:sticky; top:0; z-index:100; padding:1rem 2rem;
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(253,250,245,0.96); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(26,58,42,0.08);
}
.nav-logo { font-family:'Playfair Display',serif; font-size:1.2rem; color:var(--forest); text-decoration:none; }
.nav-logo span { color:var(--gold); }
.nav-home {
  display:inline-flex; align-items:center; gap:0.4rem;
  color:var(--forest-light); font-size:0.875rem; text-decoration:none;
  border:1px solid var(--mint); padding:0.4rem 1rem; border-radius:100px; transition:all 0.2s;
}
.nav-home:hover { background:var(--forest); color:var(--white); border-color:var(--forest); }

/* HERO */
.page-hero {
  background:linear-gradient(135deg, var(--forest) 0%, var(--forest-mid) 100%);
  padding:3.5rem 2rem 3rem; text-align:center;
}
.page-hero-label {
  display:inline-block; font-size:0.72rem; letter-spacing:0.12em;
  color:var(--gold-light); border:1px solid rgba(201,169,110,0.3);
  padding:0.3rem 0.9rem; border-radius:100px; margin-bottom:1rem;
}
.page-hero-title {
  font-family:'Playfair Display',serif; font-size:clamp(1.75rem,4vw,2.5rem);
  color:var(--white); margin-bottom:0.75rem;
}
.page-hero-sub { color:rgba(255,255,255,0.6); font-size:0.9rem; }

/* SEARCH + FILTER */
.controls {
  max-width:900px; margin:2rem auto; padding:0 1.5rem;
  display:flex; gap:1rem; flex-wrap:wrap; align-items:center;
}
.search-wrap { flex:1; min-width:200px; position:relative; }
.search-icon { position:absolute; left:1rem; top:50%; transform:translateY(-50%); color:var(--text-light); font-size:0.9rem; }
.search-input {
  width:100%; padding:0.75rem 1rem 0.75rem 2.75rem;
  border:1.5px solid #e0dcd6; border-radius:100px;
  font-family:'Sarabun',sans-serif; font-size:0.9rem; background:var(--white);
  outline:none; transition:border-color 0.2s;
}
.search-input:focus { border-color:var(--forest-light); }
.cat-filters { display:flex; gap:0.5rem; flex-wrap:wrap; }
.cat-btn {
  padding:0.5rem 1rem; border-radius:100px; border:1.5px solid #e0dcd6;
  background:var(--white); color:var(--text-mid); font-family:'Sarabun',sans-serif;
  font-size:0.8rem; cursor:pointer; transition:all 0.2s; white-space:nowrap;
}
.cat-btn:hover { border-color:var(--sage); color:var(--forest); }
.cat-btn.active { background:var(--forest); color:var(--white); border-color:var(--forest); }

/* STATS */
.stats-bar {
  max-width:900px; margin:0 auto 1.25rem; padding:0 1.5rem;
  color:var(--text-light); font-size:0.82rem;
}

/* GRID */
.blog-wrap { max-width:900px; margin:0 auto; padding:0 1.5rem 4rem; }
.blog-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem;
}

/* CARD */
.blog-card {
  background:var(--white); border-radius:16px; overflow:hidden;
  border:1px solid rgba(26,58,42,0.07); transition:transform 0.3s, box-shadow 0.3s;
  text-decoration:none; display:block; cursor:pointer;
}
.blog-card:hover { transform:translateY(-4px); box-shadow:0 12px 28px rgba(26,58,42,0.1); }
.blog-img {
  aspect-ratio:4/3; overflow:hidden; background:var(--forest-mid);
  display:flex; align-items:center; justify-content:center;
}
.blog-img img { width:100%; height:100%; object-fit:cover; transition:transform 0.5s; }
.blog-card:hover .blog-img img { transform:scale(1.05); }
.blog-img-placeholder { font-size:2.5rem; color:rgba(255,255,255,0.3); }
.blog-body { padding:1.25rem; }
.blog-cat {
  font-size:0.68rem; letter-spacing:0.08em; color:var(--forest-light);
  background:rgba(74,124,89,0.1); padding:0.2rem 0.6rem;
  border-radius:100px; display:inline-block; margin-bottom:0.6rem;
}
.blog-title {
  font-family:'Playfair Display',serif; font-size:1rem; color:var(--text-dark);
  line-height:1.4; margin-bottom:0.5rem;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.blog-excerpt {
  font-size:0.8rem; color:var(--text-light); line-height:1.6;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  margin-bottom:0.75rem;
}
.blog-date { font-size:0.75rem; color:var(--sage); }

/* LOAD MORE */
.load-more-wrap { text-align:center; margin-top:2.5rem; }
.btn-load-more {
  padding:0.85rem 2.5rem; background:var(--white); color:var(--forest);
  border:1.5px solid var(--mint); border-radius:100px;
  font-family:'Sarabun',sans-serif; font-size:0.9rem; cursor:pointer;
  transition:all 0.2s;
}
.btn-load-more:hover { background:var(--forest); color:var(--white); border-color:var(--forest); }
.btn-load-more:disabled { opacity:0.4; cursor:not-allowed; }

/* EMPTY */
.empty-state { grid-column:1/-1; text-align:center; padding:4rem 2rem; color:var(--text-light); }
.empty-icon { font-size:3rem; margin-bottom:1rem; }

/* LOADING */
.loading-wrap { grid-column:1/-1; text-align:center; padding:3rem; }
.spinner {
  width:32px; height:32px; border:3px solid var(--mint); border-top-color:var(--forest);
  border-radius:50%; animation:spin 0.7s linear infinite; margin:0 auto 0.75rem;
}
@keyframes spin { to { transform:rotate(360deg); } }

@media(max-width:700px) {
  .blog-grid { grid-template-columns:1fr 1fr; }
  .controls { flex-direction:column; }
}
@media(max-width:480px) {
  .blog-grid { grid-template-columns:1fr; }
  nav { padding:0.85rem 1.25rem; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">ฟ.เฟิน.<span>ฟาร์ม</span></a>
  <a href="index.html" class="nav-home">← กลับหน้าหลัก</a>
</nav>

<div class="page-hero">
  <div class="page-hero-label">🌿 FROM THE FARM</div>
  <h1 class="page-hero-title">บทความทั้งหมด</h1>
  <p class="page-hero-sub">ความรู้ เทคนิค และเรื่องราวจากฟาร์มลพบุรี</p>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="search-input" placeholder="ค้นหาบทความ…" oninput="handleSearch()">
  </div>
  <div class="cat-filters" id="cat-filters">
    <button class="cat-btn active" onclick="filterCat('', this)">ทั้งหมด</button>
    <button class="cat-btn" onclick="filterCat('การดูแล', this)">การดูแล</button>
    <button class="cat-btn" onclick="filterCat('เคล็ดลับ', this)">เคล็ดลับ</button>
    <button class="cat-btn" onclick="filterCat('คู่มือ', this)">คู่มือ</button>
    <button class="cat-btn" onclick="filterCat('กิจกรรมฟาร์ม', this)">กิจกรรมฟาร์ม</button>
    <button class="cat-btn" onclick="filterCat('ข่าวสาร', this)">ข่าวสาร</button>
  </div>
</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="blog-wrap">
  <div class="blog-grid" id="blog-grid">
    <div class="loading-wrap"><div class="spinner"></div></div>
  </div>
  <div class="load-more-wrap" id="load-more-wrap" style="display:none;">
    <button class="btn-load-more" id="btn-load-more" onclick="loadMore()">โหลดบทความเพิ่ม</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, where }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAzDmC2vhpnpX-Y6p4AF8-rjNaJ85qOJm8",
  authDomain:        "forfermfarm.firebaseapp.com",
  projectId:         "forfermfarm",
  storageBucket:     "forfermfarm.firebasestorage.app",
  messagingSenderId: "901153337167",
  appId:             "1:901153337167:web:79655dc0097355ddda5f3a"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const PAGE_SIZE = 9;
let allPosts    = [];
let filtered    = [];
let shown       = 0;
let currentCat  = '';
let currentQ    = '';

async function loadAllPosts() {
  try {
    const q = query(
      collection(db, 'posts'),
      where('status', '==', 'published'),
      orderBy('createdAt', 'desc')
    );
    const snap = await getDocs(q);
    allPosts = [];
    snap.forEach(d => allPosts.push({ id: d.id, ...d.data() }));
    applyFilter();
  } catch(e) {
    document.getElementById('blog-grid').innerHTML =
      `<div class="empty-state" style="color:#c0392b">โหลดไม่สำเร็จ: ${e.message}</div>`;
  }
}

function applyFilter() {
  filtered = allPosts.filter(p => {
    const matchCat = !currentCat || p.category === currentCat;
    const matchQ   = !currentQ   ||
      p.title.includes(currentQ) || (p.excerpt||'').includes(currentQ);
    return matchCat && matchQ;
  });
  shown = 0;
  renderCards(true);
}

function renderCards(reset) {
  const grid = document.getElementById('blog-grid');
  const next = filtered.slice(shown, shown + PAGE_SIZE);
  shown += next.length;

  if (reset) grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🌿</div>
        <div style="font-size:1rem;font-weight:500;color:var(--text-mid);margin-bottom:0.5rem;">ไม่พบบทความ</div>
        <div>ลองค้นหาด้วยคำอื่น หรือเลือกหมวดหมู่อื่นครับ</div>
      </div>`;
  } else {
    next.forEach(p => {
      const card = document.createElement('a');
      card.className = 'blog-card';
      card.href = `post.html?id=${p.id}`;
      card.innerHTML = `
        <div class="blog-img">
          ${p.img
            ? `<img src="${p.img}" alt="${p.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=blog-img-placeholder>🌿</div>'">`
            : `<div class="blog-img-placeholder">🌿</div>`}
        </div>
        <div class="blog-body">
          <div class="blog-cat">${p.category || 'บทความ'}</div>
          <div class="blog-title">${p.title}</div>
          <p class="blog-excerpt">${p.excerpt || ''}</p>
          <div class="blog-date">${p.date || ''}</div>
        </div>`;
      grid.appendChild(card);
    });
  }

  // stats
  document.getElementById('stats-bar').textContent =
    filtered.length > 0 ? `แสดง ${Math.min(shown, filtered.length)} จาก ${filtered.length} บทความ` : '';

  // load more button
  const wrap = document.getElementById('load-more-wrap');
  const btn  = document.getElementById('btn-load-more');
  if (shown < filtered.length) {
    wrap.style.display = 'block';
    btn.disabled = false;
    btn.textContent = `โหลดเพิ่ม (${filtered.length - shown} บทความ)`;
  } else {
    wrap.style.display = 'none';
  }
}

window.loadMore = () => renderCards(false);

window.filterCat = (cat, el) => {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  applyFilter();
};

window.handleSearch = () => {
  currentQ = document.getElementById('search-input').value.trim();
  applyFilter();
};

loadAllPosts();
</script>
</body>
</html>
